<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="poke-body">
    <header class="header">
        <div class = "header-left">
            <h2>ポケモンたち</h2>
        </div>
        <div class = "header-right">
            <button type="button" id="js-hamburger" class="hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="js-nav" class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html">ホーム</a></li>
                    <li class="nav__item"><a href="list.html">ポケモン記事</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <div class = "top-wrapper">
        <h1 id="title">好きなポケモン</h1>
    </div>
    <div id="poke-container" class = "container">
        <div class = "main-wrapper">
            <h2 class = "name-title"># 対戦</h2>
            <div class = "pokemon">
                <a href = "taisen.html"><img src="kaminari.png"></a>
                <div class = "pokemon-right">
                    <a class = "pokemon-title" href="taisen.html">メガシンカで更にかっこいい！ほうでんポケモン</a>
                    <p class = "pokemon-text">ポケットモンスター ルビー サファイアで登場</p>
                </div>
            </div>
        </div>
        <div class = "poke-side-menu">
            <div class = "profile-card">
                <h2 class = "name-title">管理人</h2>
                <img src="jibunpurin.png">
                <h3>イケダ</h3>
                <p>ポケモンが好きです。日々癒されています。</p>
            </div>
            <div class = "profile-card">
                <h2 class = "name-title">カテゴリ</h2>
                <ul class = "category-list">
                    <li><a href="buddy.html"># 相棒</a></li>
                    <li><a href="batle.html"># 対戦</a></li>
                    <li><a href="gameStorage.html"># ゲーム倉庫</a></li>
                </ul>
            </div>
            <div class="poke-btn">
                <button id="shiny-btn">色違いチャレンジ！</button>
                <p id="display-result">ボタンを押すと確率で色が変わります<br>（1/20 銀, 1/25 紫, 1/500 黄, 1/4096 緑, 1/8192 赤, それ以外 青）</p>
                <p id="counter">ボタンを押した回数：0回</p>
                <button id="reset-btn">リセット</button>
            </div>
            <ul class="accordion">
                <li>
                    <div class="accordion-q">
                        <button class="accordion-btn">
                            <span class="accordion-q-prefix">Q.</span>
                            <span class="accordion-q-content">プリンの隠れ特性は？</span>
                            <span class="accordion-q-icon"></span>
                        </button>
                    </div>
                    <div class="accordion-a">
                        <div class="accordion-a-inner">
                            <div class="accordion-a-prefix">A.</div>
                            <div class="accordion-a-content">
                                <p>フレンドガード</p>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <footer id ="poke-footer">
        <button class="secret-btn" onclick="revealText()">★</button>
        <div id="secretText" class="hidden-message">
            □　　　　□<br>
             □[ | _ | ]□
        </div>
    </footer>
    <button id="back-to-top" class="back-to-top" aria-label="ページトップへ戻る">
        ↑
    </button>
    <script src="main.js"></script>
</body>
</html>
