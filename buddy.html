<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="poke-body">
    <header class="header">
        <div class = "header-left">
            <h2>好きなポケモン</h2>
        </div>
        <div class = "header-right">
            <a href="index.html">ホーム</a>
            <a href="list.html">ポケモン記事</a>
        </div>
    </header>
    <div id="poke-container" class = "container">
        <div class = "main-wrapper">
            <h2 class = "name-title"># 相棒</h2>
            <div class = "pokemon">
                <a href = "sub.html"><img src="sakebinaku.png"></a>
                <div class = "pokemon-right">
                    <a class = "pokemon-title" href="sub.html">プリンとよく似ているパラドックスポケモン</a>
                    <p class = "pokemon-text">スカーレットバイオレットで登場</p>
                </div>
            </div>
        </div>
        <div class = "poke-side-menu">
            <div class = "profile-card">
                <h2 class = "name-title">管理人</h2>
                <img src="jibunpurin.png">
                <h3>イケダ</h3>
                <p>ポケモンが好きです。日々癒されています。</p>
            </div>
            <div class = "profile-card">
                <h2 class = "name-title">カテゴリ</h2>
                <ul class = "category-list">
                    <li><a href="buddy.html"># 相棒</a></li>
                    <li><a href="batle.html"># 対戦</a></li>
                </ul>
            </div>
            <div class="poke-btn">
                <button id="shiny-btn">色違いチャレンジ！</button>
                <p id="display-result">ボタンを押すと確率で色が変わります<br>（1/20 銀, 1/25 紫, 1/500 黄, 1/4096 緑, 1/8192 赤, それ以外 青）</p>
                <p id="counter">ボタンを押した回数：0回</p>
                <button id="reset-btn">リセット</button>
            </div>
        </div>
    </div>
    <footer id ="poke-footer">
        <button class="secret-btn" onclick="revealText()">★</button>
        <div id="secretText" class="hidden-message">
            □　　　　□<br>
             □[ | _ | ]□
        </div>
    </footer>
    <script src="main.js"></script>
</body>
</html>
